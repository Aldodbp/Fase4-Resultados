<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Proveedores y Marcas</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f4f4f4;
        }
        h2 { color: #333; }
        .input-group { margin-bottom: 15px; }
        label { font-weight: bold; display:block; margin-bottom:6px; }
        input { width: 300px; padding: 8px; margin-top: 3px; border:1px solid #ccc; border-radius:4px; }

        /* BOTÓN AZUL */
        .btn-azul {
            background-color: #007bff;
            color: white;
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-right: 10px;
            transition: 0.15s;
        }
        .btn-azul:hover { background-color: #0056b3; transform: translateY(-1px); }

        /* BOTÓN AMARILLO */
        .btn-amarillo {
            background-color: #ffc107;
            color: black;
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.15s;
        }
        .btn-amarillo:hover { background-color: #d39e00; transform: translateY(-1px); }

        table {
            width: 600px;
            margin-top: 25px;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        th, td { padding: 10px; border: 1px solid #e6e6e6; text-align:left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>Registro de Proveedores y Marcas</h2>

    <div class="input-group">
        <label for="proveedor">Proveedor:</label>
        <input type="text" id="proveedor" placeholder="Ej. Distribuidora López">
    </div>

    <div class="input-group">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" placeholder="Ej. Hasbro">
    </div>

    <button class="btn-azul" id="btnAgregar">Agregar</button>
    <button class="btn-amarillo" id="btnLimpiar">Limpiar</button>

    <table id="tabla">
        <thead>
          <tr><th>Proveedor</th><th>Marca</th><th>Acciones</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        // Datos en memoria (y opcionalmente LocalStorage)
        let registros = JSON.parse(localStorage.getItem('registros')) || [];

        const tbody = document.querySelector('#tabla tbody');
        const inpProv = document.getElementById('proveedor');
        const inpMarca = document.getElementById('marca');
        const btnAgregar = document.getElementById('btnAgregar');
        const btnLimpiar = document.getElementById('btnLimpiar');

        function render() {
            tbody.innerHTML = '';
            registros.forEach((r, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.proveedor}</td>
                    <td>${r.marca}</td>
                    <td>
                      <button style="background:#007bff;color:#fff;border:none;padding:6px;border-radius:4px;cursor:pointer;margin-right:6px" onclick="editar(${i})">Editar</button>
                      <button style="background:#ffc107;color:#000;border:none;padding:6px;border-radius:4px;cursor:pointer" onclick="eliminar(${i})">Eliminar</button>
                    </td>`;
                tbody.appendChild(tr);
            });
            localStorage.setItem('registros', JSON.stringify(registros));
        }

        function agregar() {
            const proveedor = inpProv.value.trim();
            const marca = inpMarca.value.trim();
            if (!proveedor || !marca) { alert('Rellena ambos campos.'); return; }
            registros.push({ proveedor, marca });
            inpProv.value = ''; inpMarca.value = '';
            render();
        }

        function limpiar() {
            inpProv.value = ''; inpMarca.value = '';
            inpProv.focus();
        }

        function eliminar(index) {
            if (!confirm('¿Eliminar este registro?')) return;
            registros.splice(index,1);
            render();
        }

        function editar(index) {
            const r = registros[index];
            const nuevoProv = prompt('Proveedor:', r.proveedor);
            if (nuevoProv === null) return;
            const nuevaMarca = prompt('Marca:', r.marca);
            if (nuevaMarca === null) return;
            registros[index] = { proveedor: nuevoProv.trim() || r.proveedor, marca: nuevaMarca.trim() || r.marca };
            render();
        }

        // Eventos
        btnAgregar.addEventListener('click', agregar);
        btnLimpiar.addEventListener('click', limpiar);
        inpMarca.addEventListener('keyup', (e)=>{ if (e.key==='Enter') agregar(); });

        // Init
        render();
    </script>

</body>
</html>
